name: Vardiya
options:
  bundleIdPrefix: com.batuhanhaymana
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 4U5QVH3U6A
targets:
  Vardiya:
    type: application
    platform: macOS
    sources:
      - path: Vardiya
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhanhaymana.vardiya
        PRODUCT_NAME: Vardiya
        INFOPLIST_KEY_CFBundleDisplayName: Vardiya
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Rodosgrup Yazılım Ekibi"
        GENERATE_INFOPLIST_FILE: YES
        # Sandbox kapalı: ~/.claude altındaki oturum kayıtlarını okumamız gerekiyor.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Vardiya, ofisten yazdığınız mesajı ilgili Claude oturumunun terminal sekmesine iletmek için iTerm2 veya Terminal'i kontrol eder."
        CODE_SIGN_ENTITLEMENTS: Vardiya/Resources/Vardiya.entitlements
